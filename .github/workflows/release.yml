name: Release

# Publishes to PyPI when a GitHub release is published, using Trusted
# Publishing: PyPI verifies this workflow's OIDC identity, so there is no API
# token to store or leak. Configure the publisher once at
# https://pypi.org/manage/account/publishing/ with:
#   owner: dknowles2   repository: pyskylight
#   workflow: release.yml   environment: pypi
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs reads the version from the git tags, which a shallow
          # clone does not have.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Check the tag matches the packaged version
        # hatch-vcs derives the version from the tag, so this should be true by
        # construction. It stays as a guard against the ways that silently
        # breaks — a shallow clone, or tags missing from the checkout — which
        # would otherwise publish a 0.0.x placeholder.
        if: github.event_name == 'release'
        run: |
          packaged=$(uv run --frozen python -c \
            "import importlib.metadata as m; print(m.version('pyskylight'))")
          tagged="${GITHUB_REF_NAME#v}"
          echo "tag=$tagged packaged=$packaged"
          test "$packaged" = "$tagged"

      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pyskylight
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyskylight
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
