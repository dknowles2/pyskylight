[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyskylight"
version = "0.1.0"
description = "Async Python client for the (unofficial) Skylight API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "David Knowles", email = "dknowles2@gmail.com" }]
keywords = ["skylight", "calendar", "chores", "home-assistant", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/dknowles2/pyskylight"
Issues = "https://github.com/dknowles2/pyskylight/issues"

[dependency-groups]
dev = [
    "coverage>=7.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["pyskylight"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "D"]
# __init__ and dunder methods are documented on the class itself.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = false

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
source = ["pyskylight"]
branch = true

[tool.coverage.report]
# The suite is fully offline, so there is no excuse for untested lines; the
# floor is set just under the current number to leave room for defensive code.
fail_under = 97
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "@overload",
]
